<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Định Vị Mắt Chuẩn & Màu Quân Cá Ngựa 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080a0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        /* 2/3 phía trên: Màn hình trình diễn 3D */
        #viewer-section {
            height: 66.66vh;
            width: 100%;
            position: relative;
            background: radial-gradient(circle at center, #181f2c 0%, #080a0f 100%);
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        /* Overlay hiển thị thông số */
        #info-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid #00d2ff;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            color: #00d2ff;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,210,255,0.2);
            line-height: 1.5;
        }
        /* 1/3 phía dưới: Bảng Tab điều khiển */
        #control-section {
            height: 33.34vh;
            width: 100%;
            background: #11151c;
            border-top: 2px solid #232c3d;
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
            overflow-y: auto;
        }
        .tab-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .tab-btn {
            flex: 1;
            padding: 7px 2px;
            background: #1a2230;
            border: 1px solid #2f3b52;
            color: #8a99ad;
            border-radius: 5px;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #00d2ff;
            color: #080a0f;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.4);
        }
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }
        .tab-content.active {
            display: flex;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-group label {
            width: 75px;
            font-weight: bold;
            font-size: 12px;
            color: #e2e8f0;
        }
        .label-r { color: #ff5555 !important; width: 20px !important; }
        .label-g { color: #55ff55 !important; width: 20px !important; }
        .label-b { color: #5588ff !important; width: 20px !important; }
        
        .slider-group input[type=range] {
            flex: 1;
            height: 20px;
            accent-color: #00d2ff;
        }
        .slider-group span {
            width: 45px;
            text-align: right;
            font-size: 12px;
            font-family: monospace;
            color: #00d2ff;
        }
        .mode-btn {
            background: #242e42;
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 4px;
            text-align: center;
            transition: 0.2s;
        }
        .mode-btn:active, .mode-btn.active-btn {
            background: #00d2ff;
            color: #080a0f;
        }
        .color-preview {
            height: 6px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
    <!-- Thư viện Three.js & OrbitControls (Đã đổi sang CDN ổn định hơn) -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <!-- 2/3 Màn hình 3D -->
        <div id="viewer-section">
            <canvas id="canvas3d"></canvas>
            <div id="info-overlay">
                <div><b>[ THÔNG SỐ CẮN TRỤC CHUẨN ]</b></div>
                <div id="info-eye-mode">Chế độ mắt: Cyber Neon</div>
                <div id="info-neon-status">Đèn Neon: BẬT</div>
                <div id="info-pedestal-radius">Bán kính đế: 1.00x</div>
                <div id="info-pedestal-height">Chiều cao đế: 1.00x</div>
                <div id="info-body-scale">Tỉ lệ thân: 0.70x</div>
                <div id="info-body-depth">Độ dày thân: 1.20</div>
            </div>
        </div>

        <!-- 1/3 Bảng Tab Điều Khiển -->
        <div id="control-section">
            <div class="tab-buttons">
                <div class="tab-btn active" onclick="switchTab('neon')">1. Neon</div>
                <div class="tab-btn" onclick="switchTab('eye')">2. Mắt</div>
                <div class="tab-btn" onclick="switchTab('body')">3. Thân</div>
                <div class="tab-btn" onclick="switchTab('size-base')">4. Cỡ Đế</div>
                <div class="tab-btn" onclick="switchTab('size-body')">5. Cỡ Thân</div>
            </div>

            <!-- Tab 1: Sọc Neon -->
            <div id="tab-neon" class="tab-content active">
                <div class="mode-btn active-btn" id="btn-toggle-neon" onclick="toggleNeonMode()">
                    Đèn Neon: ĐANG BẬT (Bấm để tắt)
                </div>
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="neon-r" min="0" max="255" value="0" oninput="updateAll()">
                    <span id="val-neon-r">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="neon-g" min="0" max="255" value="210" oninput="updateAll()">
                    <span id="val-neon-g">210</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="neon-b" min="0" max="255" value="255" oninput="updateAll()">
                    <span id="val-neon-b">255</span>
                </div>
                <div id="preview-neon" class="color-preview"></div>
            </div>

            <!-- Tab 2: Mắt Ngựa + Nút Chuyển Kiểu Mắt -->
            <div id="tab-eye" class="tab-content">
                <div class="mode-btn" id="btn-toggle-eye" onclick="toggleEyeMode()">
                    Đang chọn: MẮT CYBER NEON
                </div>
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="eye-r" min="0" max="255" value="255" oninput="updateAll()">
                    <span id="val-eye-r">255</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="eye-g" min="0" max="255" value="0" oninput="updateAll()">
                    <span id="val-eye-g">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="eye-b" min="0" max="255" value="180" oninput="updateAll()">
                    <span id="val-eye-b">180</span>
                </div>
                <div id="preview-eye" class="color-preview"></div>
            </div>

            <!-- Tab 3: Thân Ngựa -->
            <div id="tab-body" class="tab-content">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="body-r" min="0" max="255" value="30" oninput="updateAll()">
                    <span id="val-body-r">30</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="body-g" min="0" max="255" value="32" oninput="updateAll()">
                    <span id="val-body-g">32</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="body-b" min="0" max="255" value="40" oninput="updateAll()">
                    <span id="val-body-b">40</span>
                </div>
                <div id="preview-body" class="color-preview"></div>
            </div>

            <!-- Tab 4: Cỡ Đế -->
            <div id="tab-size-base" class="tab-content">
                <div class="slider-group">
                    <label>Bán kính Đế:</label>
                    <input type="range" id="base-radius-scale" min="0.4" max="2.0" step="0.05" value="1.0" oninput="updateAll()">
                    <span id="val-base-radius-scale">1.00x</span>
                </div>
                <div class="slider-group">
                    <label>Chiều cao Đế:</label>
                    <input type="range" id="base-height-scale" min="0.4" max="2.0" step="0.05" value="1.0" oninput="updateAll()">
                    <span id="val-base-height-scale">1.00x</span>
                </div>
            </div>

            <!-- Tab 5: Cỡ Thân -->
            <div id="tab-size-body" class="tab-content">
                <div class="slider-group">
                    <label>Tỉ lệ Thân:</label>
                    <input type="range" id="body-scale" min="0.20" max="1.50" step="0.02" value="0.70" oninput="updateAll()">
                    <span id="val-body-scale">0.70x</span>
                </div>
                <div class="slider-group">
                    <label>Độ dày Thân:</label>
                    <input type="range" id="body-depth" min="0.4" max="2.5" step="0.1" value="1.2" oninput="rebuildBodyGeometry()">
                    <span id="val-body-depth">1.2</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let bodyMaterial, eyeMaterial, neonMaterial, baseGlowMaterial, socketMat, frameMat;
        let eyeNormalMats = {}; 
        let isNeonEye = true;
        let isNeonOn = true; 

        let modelGroup, pedestalGroup, bodyUpperGroup, headMesh, eyeGroup, neonGroup;
        let horseShape, eyeGeometries = {};

        const BASE_PEDESTAL_TOP_Y = 1.05;
        const MID_BOTTOM_X = -0.05;

        function init() {
            const container = document.getElementById('viewer-section');
            const canvas = document.getElementById('canvas3d');

            scene = new THREE.Scene();

            // Góc Camera 3/4 nhìn nghiêng từ trái sang, hơi chếch lên giống ảnh mẫu
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(-5.5, 4.5, 7.5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 2.2, 0); // Nhìn vào phần thân trên

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-5, 10, 7);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00d2ff, 1.5, 15);
            pointLight.position.set(-4, 6, 4);
            scene.add(pointLight);
            
            const pointLight2 = new THREE.PointLight(0xff00b4, 1.0, 15);
            pointLight2.position.set(4, 3, -2);
            scene.add(pointLight2);

            // Shape 2D 
            horseShape = new THREE.Shape();
            horseShape.moveTo(-0.9, -0.2);
            horseShape.bezierCurveTo(-1.3, 1.5, -1.4, 3.2, -0.9, 4.6);
            horseShape.bezierCurveTo(-1.0, 5.4, -0.8, 6.2, -0.3, 6.6);
            horseShape.lineTo(-0.1, 6.7);
            horseShape.bezierCurveTo(0.0, 5.9, 0.3, 5.5, 0.7, 5.3);
            horseShape.bezierCurveTo(1.3, 5.0, 2.3, 4.3, 2.7, 3.6);
            horseShape.bezierCurveTo(2.8, 3.1, 2.3, 2.8, 1.8, 2.9);
            horseShape.bezierCurveTo(1.4, 2.7, 1.0, 2.3, 0.8, 1.7);
            horseShape.bezierCurveTo(0.6, 0.9, 0.7, 0.3, 0.8, -0.2);
            horseShape.closePath();

            eyeGeometries = {
                socket: new THREE.SphereGeometry(0.43, 40, 28),
                ball: new THREE.SphereGeometry(0.34, 48, 32),
                pupil: new THREE.SphereGeometry(0.145, 32, 24),
                iris: new THREE.RingGeometry(0.17, 0.265, 48),
                glint1: new THREE.SphereGeometry(0.072, 20, 16),
                glint2: new THREE.SphereGeometry(0.032, 16, 12)
            };

            eyeNormalMats = {
                ball: new THREE.MeshPhysicalMaterial({ color: 0x5b3518, roughness: 0.12, metalness: 0.02, clearcoat: 1, clearcoatRoughness: 0.04 }),
                pupil: new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.02 }),
                iris: new THREE.MeshBasicMaterial({ color: 0x8a4b20, side: THREE.DoubleSide }),
                glint: new THREE.MeshBasicMaterial({ color: 0xffffff })
            };

            socketMat = new THREE.MeshPhysicalMaterial({ roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.08 });
            frameMat = new THREE.MeshStandardMaterial({ color: 0x888c99, metalness: 0.9, roughness: 0.3 });

            createHorse3D();

            window.addEventListener('resize', onWindowResize);
            updateAll();
            animate();
        }

        function buildEye(side) {
            const g = new THREE.Group();
            const bodyDepth = parseFloat(document.getElementById('body-depth').value);
            
            // Định vị mắt: Đặt ở vị trí đầu ngựa, nhô ra khỏi bề mặt theo độ dày
            g.position.set(-0.6, 5.0, (bodyDepth / 2 + 0.05) * side);
            g.rotation.y = side > 0 ? -0.15 : Math.PI + 0.15;
            g.rotation.z = -0.1; 

            const add = (geo, mat, sc, pos) => {
                const m = new THREE.Mesh(geo, mat);
                if (sc) m.scale.set(...sc);
                m.position.set(...pos);
                g.add(m);
                return m;
            };

            if (isNeonEye) {
                // MẮT CYBER (Khung xám, khe sáng neon)
                const frameGeo = new THREE.BoxGeometry(0.5, 0.22, 0.15);
                const visorGeo = new THREE.BoxGeometry(0.38, 0.06, 0.05);
                const boltGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.05, 8);
                boltGeo.rotateX(Math.PI / 2);

                add(frameGeo, frameMat, [1, 1, 1], [0, 0, 0]);
                add(visorGeo, eyeMaterial, [1, 1, 1], [0, 0, 0.08]);
                add(boltGeo, frameMat, [1, 1, 1], [-0.2, 0, 0.08]);
                add(boltGeo, frameMat, [1, 1, 1], [0.2, 0, 0.08]);

            } else {
                // MẮT THƯỜNG (Hữu cơ)
                const sx = side;
                add(eyeGeometries.socket, socketMat, [1, 0.82, 0.34], [0, 0, 0.10]);
                add(eyeGeometries.ball, eyeNormalMats.ball, [1, 0.92, 0.55], [0, 0, 0.16]);
                add(eyeGeometries.pupil, eyeNormalMats.pupil, [1, 1.08, 0.45], [0.025 * sx, -0.005, 0.40]);
                add(eyeGeometries.iris, eyeNormalMats.iris, [1, 0.92, 1], [0, 0, 0.39]);
                add(eyeGeometries.glint1, eyeNormalMats.glint, null, [-0.09 * sx, 0.105, 0.56]);
                add(eyeGeometries.glint2, eyeNormalMats.glint, null, [0.105 * sx, -0.015, 0.55]);
            }

            return g;
        }

        function createHorse3D() {
            modelGroup = new THREE.Group();

            // Chất liệu thân (Màu tối giống sợi carbon)
            bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1c23,
                roughness: 0.6,
                metalness: 0.4
            });

            // Chất liệu mắt
            eyeMaterial = new THREE.MeshBasicMaterial({
                color: 0xff00b4,
                toneMapped: false
            });

            // Chất liệu Neon
            neonMaterial = new THREE.MeshBasicMaterial({
                color: 0x00d2ff,
                toneMapped: false
            });

            // 1. Bệ Đỡ
            pedestalGroup = new THREE.Group();
            const botGeo = new THREE.CylinderGeometry(1.35, 1.5, 0.3, 48);
            const midGeo = new THREE.CylinderGeometry(1.15, 1.28, 0.25, 48);
            const topGeo = new THREE.CylinderGeometry(0.9, 1.12, 0.5, 48);

            const botMesh = new THREE.Mesh(botGeo, bodyMaterial); botMesh.position.y = 0.15 - BASE_PEDESTAL_TOP_Y;
            const midMesh = new THREE.Mesh(midGeo, bodyMaterial); midMesh.position.y = 0.425 - BASE_PEDESTAL_TOP_Y;
            const topMesh = new THREE.Mesh(topGeo, bodyMaterial); topMesh.position.y = 0.8 - BASE_PEDESTAL_TOP_Y;

            pedestalGroup.add(botMesh, midMesh, topMesh);
            
            // Vòng Neon trên đế
            const baseRing1 = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.03, 16, 64), neonMaterial);
            baseRing1.rotation.x = Math.PI / 2;
            baseRing1.position.y = 0.1 - BASE_PEDESTAL_TOP_Y;
            
            const baseRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.02, 16, 64), neonMaterial);
            baseRing2.rotation.x = Math.PI / 2;
            baseRing2.position.y = 0.5 - BASE_PEDESTAL_TOP_Y;

            pedestalGroup.add(baseRing1, baseRing2);
            modelGroup.add(pedestalGroup);

            // 2. Thân Trên
            bodyUpperGroup = new THREE.Group();
            bodyUpperGroup.position.y = BASE_PEDESTAL_TOP_Y; // Đặt thân ngựa lên đỉnh đế

            const depth = parseFloat(document.getElementById('body-depth').value);
            const horseGeo = new THREE.ExtrudeGeometry(horseShape, {
                steps: 2,
                depth: depth,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.15,
                bevelSegments: 5
            });

            headMesh = new THREE.Mesh(horseGeo, bodyMaterial);
            headMesh.position.set(-MID_BOTTOM_X, 0, -depth / 2);
            bodyUpperGroup.add(headMesh);

            // 3. Mắt
            eyeGroup = new THREE.Group();
            eyeGroup.add(buildEye(1), buildEye(-1));
            eyeGroup.position.set(-MID_BOTTOM_X, 0, 0);
            bodyUpperGroup.add(eyeGroup);

            // 4. Hệ thống sọc Neon (Mạch điện tử)
            neonGroup = new THREE.Group();
            
            const createNeonTube = (curvePoints, radius = 0.025) => {
                const curve = new THREE.CatmullRomCurve3(curvePoints);
                const tubeGeo = new THREE.TubeGeometry(curve, 32, radius, 8, false);
                return new THREE.Mesh(tubeGeo, neonMaterial);
            };

            const zFront = depth / 2 + 0.02;
            const zBack = -depth / 2 - 0.02;

            // Đường mạch bên phải
            const lineManeR = [
                new THREE.Vector3(-0.6, 1.0, zFront),
                new THREE.Vector3(-0.7, 2.5, zFront),
                new THREE.Vector3(-0.4, 4.0, zFront),
                new THREE.Vector3(0.0, 5.5, zFront)
            ];
            const lineCheekR = [
                new THREE.Vector3(0.5, 1.5, zFront),
                new THREE.Vector3(0.8, 3.0, zFront),
                new THREE.Vector3(1.2, 4.2, zFront)
            ];
            const lineJawR = [
                new THREE.Vector3(1.8, 2.8, zFront),
                new THREE.Vector3(1.4, 3.5, zFront),
                new THREE.Vector3(1.7, 4.5, zFront),
                new THREE.Vector3(1.9, 5.0, zFront)
            ];

            // Đường mạch bên trái
            const lineManeL = lineManeR.map(p => new THREE.Vector3(p.x, p.y, zBack));
            const lineCheekL = lineCheekR.map(p => new THREE.Vector3(p.x, p.y, zBack));
            const lineJawL = lineJawR.map(p => new THREE.Vector3(p.x, p.y, zBack));

            neonGroup.add(createNeonTube(lineManeR, 0.03));
            neonGroup.add(createNeonTube(lineCheekR, 0.02));
            neonGroup.add(createNeonTube(lineJawR, 0.025));

            neonGroup.add(createNeonTube(lineManeL, 0.03));
            neonGroup.add(createNeonTube(lineCheekL, 0.02));
            neonGroup.add(createNeonTube(lineJawL, 0.025));

            bodyUpperGroup.add(neonGroup);
            modelGroup.add(bodyUpperGroup);
            scene.add(modelGroup);
        }

        function toggleEyeMode() {
            isNeonEye = !isNeonEye;
            const btn = document.getElementById('btn-toggle-eye');
            const overlayInfo = document.getElementById('info-eye-mode');

            if (isNeonEye) {
                btn.innerText = "Đang chọn: MẮT CYBER NEON";
                btn.classList.add('active-btn');
                overlayInfo.innerText = "Chế độ mắt: Cyber Neon";
            } else {
                btn.innerText = "Đang chọn: MẮT THƯỜNG";
                btn.classList.remove('active-btn');
                overlayInfo.innerText = "Chế độ mắt: Mắt Thường";
            }

            if (eyeGroup) {
                bodyUpperGroup.remove(eyeGroup);
                eyeGroup = new THREE.Group();
                eyeGroup.add(buildEye(1), buildEye(-1));
                eyeGroup.position.set(-MID_BOTTOM_X, 0, 0);
                bodyUpperGroup.add(eyeGroup);
            }

            updateAll();
        }

        function toggleNeonMode() {
            isNeonOn = !isNeonOn;
            const btn = document.getElementById('btn-toggle-neon');
            const overlayInfo = document.getElementById('info-neon-status');
            
            if (isNeonOn) {
                btn.innerText = "Đèn Neon: ĐANG BẬT (Bấm để tắt)";
                btn.classList.add('active-btn');
                overlayInfo.innerText = "Đèn Neon: BẬT";
            } else {
                btn.innerText = "Đèn Neon: ĐANG TẮT (Bấm để bật)";
                btn.classList.remove('active-btn');
                overlayInfo.innerText = "Đèn Neon: TẮT";
            }
            
            if (neonGroup) neonGroup.visible = isNeonOn;
            if (pedestalGroup) {
                pedestalGroup.children.forEach(c => {
                    if (c.geometry && c.geometry.type === 'TorusGeometry') c.visible = isNeonOn;
                });
            }
        }

        function rebuildBodyGeometry() {
            const depth = parseFloat(document.getElementById('body-depth').value);
            document.getElementById('val-body-depth').innerText = depth.toFixed(1);

            const newGeo = new THREE.ExtrudeGeometry(horseShape, {
                steps: 2,
                depth: depth,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.15,
                bevelSegments: 5
            });

            headMesh.geometry.dispose();
            headMesh.geometry = newGeo;
            headMesh.position.set(-MID_BOTTOM_X, 0, -depth / 2);

            // Rebuild mắt & neon để cập nhật tọa độ Z
            if (bodyUpperGroup) {
                bodyUpperGroup.remove(eyeGroup);
                bodyUpperGroup.remove(neonGroup);
                
                eyeGroup = new THREE.Group();
                eyeGroup.add(buildEye(1), buildEye(-1));
                eyeGroup.position.set(-MID_BOTTOM_X, 0, 0);
                bodyUpperGroup.add(eyeGroup);
                
                const neonGroupNew = new THREE.Group();
                const createNeonTube = (curvePoints, radius = 0.025) => {
                    const curve = new THREE.CatmullRomCurve3(curvePoints);
                    const tubeGeo = new THREE.TubeGeometry(curve, 32, radius, 8, false);
                    return new THREE.Mesh(tubeGeo, neonMaterial);
                };
                const zFront = depth / 2 + 0.02;
                const zBack = -depth / 2 - 0.02;
                
                const lineManeR = [ new THREE.Vector3(-0.6, 1.0, zFront), new THREE.Vector3(-0.7, 2.5, zFront), new THREE.Vector3(-0.4, 4.0, zFront), new THREE.Vector3(0.0, 5.5, zFront) ];
                const lineCheekR = [ new THREE.Vector3(0.5, 1.5, zFront), new THREE.Vector3(0.8, 3.0, zFront), new THREE.Vector3(1.2, 4.2, zFront) ];
                const lineJawR = [ new THREE.Vector3(1.8, 2.8, zFront), new THREE.Vector3(1.4, 3.5, zFront), new THREE.Vector3(1.7, 4.5, zFront), new THREE.Vector3(1.9, 5.0, zFront) ];
                
                neonGroupNew.add(createNeonTube(lineManeR, 0.03), createNeonTube(lineCheekR, 0.02), createNeonTube(lineJawR, 0.025));
                neonGroupNew.add(createNeonTube(lineManeR.map(p => new THREE.Vector3(p.x, p.y, zBack)), 0.03));
                neonGroupNew.add(createNeonTube(lineCheekR.map(p => new THREE.Vector3(p.x, p.y, zBack)), 0.02));
                neonGroupNew.add(createNeonTube(lineJawR.map(p => new THREE.Vector3(p.x, p.y, zBack)), 0.025));
                
                neonGroupNew.visible = isNeonOn;
                neonGroup = neonGroupNew;
                bodyUpperGroup.add(neonGroup);
            }
            updateAll();
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-section');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const tabMap = { 'neon': 0, 'eye': 1, 'body': 2, 'size-base': 3, 'size-body': 4 };
            const idx = tabMap[tabName];
            if (idx !== undefined) {
                document.querySelectorAll('.tab-btn')[idx].classList.add('active');
                document.getElementById(`tab-${tabName}`).classList.add('active');
            }
        }

        function updateAll() {
            const rScale = parseFloat(document.getElementById('base-radius-scale').value);
            const hScale = parseFloat(document.getElementById('base-height-scale').value);
            const bScale = parseFloat(document.getElementById('body-scale').value);
            const bDepth = parseFloat(document.getElementById('body-depth').value);

            document.getElementById('val-base-radius-scale').innerText = rScale.toFixed(2) + 'x';
            document.getElementById('val-base-height-scale').innerText = hScale.toFixed(2) + 'x';
            document.getElementById('val-body-scale').innerText = bScale.toFixed(2) + 'x';

            pedestalGroup.scale.set(rScale, hScale, rScale);
            
            // Cập nhật Scale thân và điều chỉnh lại trục Y để không bị lơ lửng
            bodyUpperGroup.scale.setScalar(bScale);
            bodyUpperGroup.position.y = BASE_PEDESTAL_TOP_Y; 

            document.getElementById('info-pedestal-radius').innerText = `Bán kính đế: ${rScale.toFixed(2)}x`;
            document.getElementById('info-pedestal-height').innerText = `Chiều cao đế: ${hScale.toFixed(2)}x`;
            document.getElementById('info-body-scale').innerText = `Tỉ lệ thân: ${bScale.toFixed(2)}x`;
            document.getElementById('info-body-depth').innerText = `Độ dày thân: ${bDepth.toFixed(1)}`;

            // Cập nhật màu Neon
            const nr = parseInt(document.getElementById('neon-r').value);
            const ng = parseInt(document.getElementById('neon-g').value);
            const nb = parseInt(document.getElementById('neon-b').value);
            document.getElementById('val-neon-r').innerText = nr;
            document.getElementById('val-neon-g').innerText = ng;
            document.getElementById('val-neon-b').innerText = nb;
            document.getElementById('preview-neon').style.backgroundColor = `rgb(${nr},${ng},${nb})`;

            if (neonMaterial) {
                neonMaterial.color.setRGB(nr / 255, ng / 255, nb / 255);
            }

            // Cập nhật màu Mắt
            const er = parseInt(document.getElementById('eye-r').value);
            const eg = parseInt(document.getElementById('eye-g').value);
            const eb = parseInt(document.getElementById('eye-b').value);
            document.getElementById('val-eye-r').innerText = er;
            document.getElementById('val-eye-g').innerText = eg;
            document.getElementById('val-eye-b').innerText = eb;
            document.getElementById('preview-eye').style.backgroundColor = `rgb(${er},${eg},${eb})`;

            if (eyeMaterial) {
                eyeMaterial.color.setRGB(er / 255, eg / 255, eb / 255);
            }

            // Cập nhật màu Thân
            const br = parseInt(document.getElementById('body-r').value);
            const bg = parseInt(document.getElementById('body-g').value);
            const bb = parseInt(document.getElementById('body-b').value);
            document.getElementById('val-body-r').innerText = br;
            document.getElementById('val-body-g').innerText = bg;
            document.getElementById('val-body-b').innerText = bb;
            document.getElementById('preview-body').style.backgroundColor = `rgb(${br},${bg},${bb})`;

            if (bodyMaterial) {
                bodyMaterial.color.setRGB(br / 255, bg / 255, bb / 255);
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
