<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Quân Cá Ngựa Cyber 3D - Khung Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080a0f;
            font-family: sans-serif;
            color: #ffffff;
        }
        #container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        /* 2/3 phía trên: Màn hình 3D */
        #viewer-section {
            height: 66.66vh;
            width: 100%;
            position: relative;
            background: radial-gradient(circle at center, #161b26 0%, #080a0f 100%);
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        /* 1/3 phía dưới: Bảng điều khiển tab & slider RGB */
        #control-section {
            height: 33.34vh;
            width: 100%;
            background: #11151c;
            border-top: 2px solid #232c3d;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            overflow-y: auto;
        }
        .tab-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: #1a2230;
            border: 1px solid #2f3b52;
            color: #8a99ad;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #00d2ff;
            color: #080a0f;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.4);
        }
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }
        .tab-content.active {
            display: flex;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-group label {
            width: 18px;
            font-weight: bold;
            font-size: 13px;
        }
        .label-r { color: #ff5555; }
        .label-g { color: #55ff55; }
        .label-b { color: #5588ff; }
        .slider-group input[type=range] {
            flex: 1;
            height: 22px;
            accent-color: #00d2ff;
        }
        .slider-group span {
            width: 30px;
            text-align: right;
            font-size: 12px;
            font-family: monospace;
            color: #a0aec0;
        }
        .color-preview {
            height: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
    <!-- Thư viện Three.js và OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <!-- Khung 3D hiển thị quân ngựa -->
        <div id="viewer-section">
            <canvas id="canvas3d"></canvas>
        </div>
        <!-- Khung điều khiển RGB -->
        <div id="control-section">
            <div class="tab-buttons">
                <div class="tab-btn active" onclick="switchTab('neon')">1. Sọc Neon</div>
                <div class="tab-btn" onclick="switchTab('eye')">2. Mắt Ngựa</div>
                <div class="tab-btn" onclick="switchTab('body')">3. Thân Ngựa</div>
            </div>

            <!-- Tab 1: Sọc Neon -->
            <div id="tab-neon" class="tab-content active">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="neon-r" min="0" max="255" value="0" oninput="updateColors()">
                    <span id="val-neon-r">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="neon-g" min="0" max="255" value="210" oninput="updateColors()">
                    <span id="val-neon-g">210</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="neon-b" min="0" max="255" value="255" oninput="updateColors()">
                    <span id="val-neon-b">255</span>
                </div>
                <div id="preview-neon" class="color-preview"></div>
            </div>

            <!-- Tab 2: Mắt Ngựa -->
            <div id="tab-eye" class="tab-content">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="eye-r" min="0" max="255" value="255" oninput="updateColors()">
                    <span id="val-eye-r">255</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="eye-g" min="0" max="255" value="0" oninput="updateColors()">
                    <span id="val-eye-g">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="eye-b" min="0" max="255" value="180" oninput="updateColors()">
                    <span id="val-eye-b">180</span>
                </div>
                <div id="preview-eye" class="color-preview"></div>
            </div>

            <!-- Tab 3: Thân Ngựa -->
            <div id="tab-body" class="tab-content">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="body-r" min="0" max="255" value="25" oninput="updateColors()">
                    <span id="val-body-r">25</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="body-g" min="0" max="255" value="30" oninput="updateColors()">
                    <span id="val-body-g">30</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="body-b" min="0" max="255" value="40" oninput="updateColors()">
                    <span id="val-body-b">40</span>
                </div>
                <div id="preview-body" class="color-preview"></div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let bodyMaterial, eyeMaterial, neonMaterial;

        function init() {
            const container = document.getElementById('viewer-section');
            const canvas = document.getElementById('canvas3d');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 6.0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1.8, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            createCyberHorse();

            window.addEventListener('resize', onWindowResize);
            updateColors();
            animate();
        }

        function createCyberHorse() {
            const horseGroup = new THREE.Group();

            bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x191e28,
                roughness: 0.3,
                metalness: 0.85
            });

            eyeMaterial = new THREE.MeshStandardMaterial({
                color: 0xff00b4,
                emissive: 0xff00b4,
                emissiveIntensity: 0.9,
                roughness: 0.2
            });

            neonMaterial = new THREE.MeshStandardMaterial({
                color: 0x00d2ff,
                emissive: 0x00d2ff,
                emissiveIntensity: 0.95,
                roughness: 0.1
            });

            const baseBot = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.5, 0.35, 32), bodyMaterial);
            baseBot.position.y = 0.175;
            horseGroup.add(baseBot);

            const baseRing = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.035, 16, 48), neonMaterial);
            baseRing.rotation.x = Math.PI / 2;
            baseRing.position.y = 0.175;
            horseGroup.add(baseRing);

            const baseMid = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.2, 0.4, 32), bodyMaterial);
            baseMid.position.y = 0.55;
            horseGroup.add(baseMid);

            const shape = new THREE.Shape();
            shape.moveTo(-0.7, -0.2);
            shape.bezierCurveTo(-1.1, 1.2, -1.2, 2.6, -0.7, 3.8);
            shape.bezierCurveTo(-0.8, 4.5, -0.6, 5.2, -0.2, 5.5);
            shape.lineTo(0.0, 5.6);
            shape.bezierCurveTo(0.1, 4.9, 0.3, 4.5, 0.6, 4.3);
            shape.bezierCurveTo(1.1, 4.0, 1.9, 3.4, 2.2, 2.8);
            shape.bezierCurveTo(2.3, 2.4, 1.9, 2.2, 1.5, 2.3);
            shape.bezierCurveTo(1.2, 2.1, 0.9, 1.8, 0.7, 1.3);
            shape.bezierCurveTo(0.5, 0.7, 0.6, 0.2, 0.7, -0.2);
            shape.closePath();

            const extrudeSettings = {
                steps: 2,
                depth: 0.7,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.15,
                bevelSegments: 5
            };

            const headGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            headGeo.center();
            const headMesh = new THREE.Mesh(headGeo, bodyMaterial);
            headMesh.position.set(0, 2.1, 0);
            horseGroup.add(headMesh);

            const eyeGeo = new THREE.BoxGeometry(0.38, 0.16, 0.76);
            
            const eyeRight = new THREE.Mesh(eyeGeo, eyeMaterial);
            eyeRight.position.set(0.42, 2.65, 0);
            eyeRight.rotation.z = -0.12;
            horseGroup.add(eyeRight);

            const eyeLeft = new THREE.Mesh(eyeGeo, eyeMaterial);
            eyeLeft.position.set(-0.42, 2.65, 0);
            eyeLeft.rotation.z = 0.12;
            horseGroup.add(eyeLeft);

            const neonGroup = new THREE.Group();
            const createNeonTube = (curvePoints, zOffset) => {
                const curve = new THREE.CatmullRomCurve3(curvePoints);
                const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.03, 8, false);
                const tube = new THREE.Mesh(tubeGeo, neonMaterial);
                if (zOffset) tube.position.z = zOffset;
                return tube;
            };

            const maneCurve1 = [
                new THREE.Vector3(0.4, 1.2, 0.38),
                new THREE.Vector3(0.7, 1.9, 0.38),
                new THREE.Vector3(0.85, 2.5, 0.38),
                new THREE.Vector3(0.2, 3.2, 0.38)
            ];
            neonGroup.add(createNeonTube(maneCurve1, 0));
            neonGroup.add(createNeonTube(maneCurve1, -0.76));

            const faceCurve1 = [
                new THREE.Vector3(-0.5, 2.2, 0.38),
                new THREE.Vector3(-0.1, 2.0, 0.38),
                new THREE.Vector3(0.2, 1.4, 0.38),
                new THREE.Vector3(0.1, 0.7, 0.38)
            ];
            neonGroup.add(createNeonTube(faceCurve1, 0));
            neonGroup.add(createNeonTube(faceCurve1, -0.76));

            horseGroup.add(neonGroup);
            scene.add(horseGroup);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-section');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'neon') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-neon').classList.add('active');
            } else if (tabName === 'eye') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-eye').classList.add('active');
            } else if (tabName === 'body') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-body').classList.add('active');
            }
        }

        function updateColors() {
            const nr = parseInt(document.getElementById('neon-r').value);
            const ng = parseInt(document.getElementById('neon-g').value);
            const nb = parseInt(document.getElementById('neon-b').value);
            document.getElementById('val-neon-r').innerText = nr;
            document.getElementById('val-neon-g').innerText = ng;
            document.getElementById('val-neon-b').innerText = nb;
            document.getElementById('preview-neon').style.backgroundColor = `rgb(${nr},${ng},${nb})`;

            if (neonMaterial) {
                const col = new THREE.Color(nr / 255, ng / 255, nb / 255);
                neonMaterial.color = col;
                neonMaterial.emissive = col;
            }

            const er = parseInt(document.getElementById('eye-r').value);
            const eg = parseInt(document.getElementById('eye-g').value);
            const eb = parseInt(document.getElementById('eye-b').value);
            document.getElementById('val-eye-r').innerText = er;
            document.getElementById('val-eye-g').innerText = eg;
            document.getElementById('val-eye-b').innerText = eb;
            document.getElementById('preview-eye').style.backgroundColor = `rgb(${er},${eg},${eb})`;

            if (eyeMaterial) {
                const col = new THREE.Color(er / 255, eg / 255, eb / 255);
                eyeMaterial.color = col;
                eyeMaterial.emissive = col;
            }

            const br = parseInt(document.getElementById('body-r').value);
            const bg = parseInt(document.getElementById('body-g').value);
            const bb = parseInt(document.getElementById('body-b').value);
            document.getElementById('val-body-r').innerText = br;
            document.getElementById('val-body-g').innerText = bg;
            document.getElementById('val-body-b').innerText = bb;
            document.getElementById('preview-body').style.backgroundColor = `rgb(${br},${bg},${bb})`;

            if (bodyMaterial) {
                bodyMaterial.color = new THREE.Color(br / 255, bg / 255, bb / 255);
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
