<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Cyber Horse Pawn Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080a0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        /* 2/3 trên: Trình diễn 3D */
        #viewport-section {
            height: 66.66vh;
            width: 100%;
            position: relative;
            background: radial-gradient(circle at center, #161b26 0%, #080a0f 100%);
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        /* 1/3 dưới: Bảng tab chỉnh màu */
        #control-section {
            height: 33.34vh;
            width: 100%;
            background: #11151c;
            border-top: 2px solid #232c3d;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
            overflow-y: auto;
        }
        .tab-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: #1a2230;
            border: 1px solid #2f3b52;
            color: #8a99ad;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #00d2ff;
            color: #080a0f;
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.4);
        }
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }
        .tab-content.active {
            display: flex;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-group label {
            width: 18px;
            font-weight: bold;
            font-size: 13px;
        }
        .label-r { color: #ff5555; }
        .label-g { color: #55ff55; }
        .label-b { color: #5588ff; }
        .slider-group input[type=range] {
            flex: 1;
            height: 22px;
            accent-color: #00d2ff;
        }
        .slider-group span {
            width: 30px;
            text-align: right;
            font-size: 12px;
            font-family: monospace;
            color: #a0aec0;
        }
        .color-preview {
            height: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 2px;
        }
    </style>
    <!-- Thư viện Three.js CDN chuẩn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Module 3D Ngựa đã được tách file -->
    <script src="three.min.new.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- 2/3 trên: Hiển thị 3D -->
        <div id="viewport-section">
            <canvas id="webgl-canvas"></canvas>
        </div>

        <!-- 1/3 dưới: Các Tab điều khiển RGB -->
        <div id="control-section">
            <div class="tab-buttons">
                <div class="tab-btn active" onclick="switchTab('neon')">⚡ Sọc Neon</div>
                <div class="tab-btn" onclick="switchTab('eye')">👁️ Mắt Ngựa</div>
                <div class="tab-btn" onclick="switchTab('body')">🐴 Thân Ngựa</div>
            </div>

            <!-- Tab 1: Sọc Neon -->
            <div id="tab-neon" class="tab-content active">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="neon-r" min="0" max="255" value="0" oninput="onColorChange()">
                    <span id="val-neon-r">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="neon-g" min="0" max="255" value="210" oninput="onColorChange()">
                    <span id="val-neon-g">210</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="neon-b" min="0" max="255" value="255" oninput="onColorChange()">
                    <span id="val-neon-b">255</span>
                </div>
                <div id="preview-neon" class="color-preview"></div>
            </div>

            <!-- Tab 2: Mắt Ngựa -->
            <div id="tab-eye" class="tab-content">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="eye-r" min="0" max="255" value="255" oninput="onColorChange()">
                    <span id="val-eye-r">255</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="eye-g" min="0" max="255" value="0" oninput="onColorChange()">
                    <span id="val-eye-g">0</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="eye-b" min="0" max="255" value="180" oninput="onColorChange()">
                    <span id="val-eye-b">180</span>
                </div>
                <div id="preview-eye" class="color-preview"></div>
            </div>

            <!-- Tab 3: Thân Ngựa -->
            <div id="tab-body" class="tab-content">
                <div class="slider-group">
                    <label class="label-r">R</label>
                    <input type="range" id="body-r" min="0" max="255" value="25" oninput="onColorChange()">
                    <span id="val-body-r">25</span>
                </div>
                <div class="slider-group">
                    <label class="label-g">G</label>
                    <input type="range" id="body-g" min="0" max="255" value="30" oninput="onColorChange()">
                    <span id="val-body-g">30</span>
                </div>
                <div class="slider-group">
                    <label class="label-b">B</label>
                    <input type="range" id="body-b" min="0" max="255" value="40" oninput="onColorChange()">
                    <span id="val-body-b">40</span>
                </div>
                <div id="preview-body" class="color-preview"></div>
            </div>
        </div>
    </div>

    <script>
        // Chuyển Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'neon') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-neon').classList.add('active');
            } else if (tabName === 'eye') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-eye').classList.add('active');
            } else if (tabName === 'body') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-body').classList.add('active');
            }
        }

        // Cập nhật giá trị thanh slider và gửi sang 3D Engine
        function onColorChange() {
            // Neon
            const nr = parseInt(document.getElementById('neon-r').value);
            const ng = parseInt(document.getElementById('neon-g').value);
            const nb = parseInt(document.getElementById('neon-b').value);
            document.getElementById('val-neon-r').innerText = nr;
            document.getElementById('val-neon-g').innerText = ng;
            document.getElementById('val-neon-b').innerText = nb;
            document.getElementById('preview-neon').style.backgroundColor = `rgb(${nr},${ng},${nb})`;
            HorseApp.setNeonColor(nr, ng, nb);

            // Eye
            const er = parseInt(document.getElementById('eye-r').value);
            const eg = parseInt(document.getElementById('eye-g').value);
            const eb = parseInt(document.getElementById('eye-b').value);
            document.getElementById('val-eye-r').innerText = er;
            document.getElementById('val-eye-g').innerText = eg;
            document.getElementById('val-eye-b').innerText = eb;
            document.getElementById('preview-eye').style.backgroundColor = `rgb(${er},${eg},${eb})`;
            HorseApp.setEyeColor(er, eg, eb);

            // Body
            const br = parseInt(document.getElementById('body-r').value);
            const bg = parseInt(document.getElementById('body-g').value);
            const bb = parseInt(document.getElementById('body-b').value);
            document.getElementById('val-body-r').innerText = br;
            document.getElementById('val-body-g').innerText = bg;
            document.getElementById('val-body-b').innerText = bb;
            document.getElementById('preview-body').style.backgroundColor = `rgb(${br},${bg},${bb})`;
            HorseApp.setBodyColor(br, bg, bb);
        }

        // Khởi chạy
        window.addEventListener('DOMContentLoaded', () => {
            HorseApp.init('webgl-canvas', 'viewport-section');
            onColorChange();
        });
    </script>
</body>
</html>
