<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12080a">
<link rel="manifest" href="manifest.webmanifest">
<title>Cá Ngựa 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12080a;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#boardFrame{position:fixed;inset:0;border:0;width:100%;height:100%;background:#080704;z-index:1;display:none}
#hud{position:fixed;left:0;right:0;top:0;padding:8px 10px;display:none;flex-direction:column;align-items:flex-start;gap:6px;
 background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);pointer-events:none;z-index:5;max-width:calc(100% - 160px)}
#hudRow{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.badge{padding:6px 10px;border-radius:10px;font-weight:800;font-size:12px;color:#fff;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
#badgeColor{min-width:52px;text-align:center}
#badgeDice{min-width:36px;text-align:center;background:#333}
#badgeMode{min-width:40px;text-align:center;background:#7c2d12}
#badgeMode.classic{background:#333}
#btnGear{
  pointer-events:auto!important;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.75);color:#fde68a;font-weight:800;font-size:16px;cursor:pointer;
  touch-action:manipulation;line-height:1;min-width:40px;text-align:center;z-index:50;position:relative
}
#btnGear:active{transform:scale(.94);background:#7c2d12}
#btnAuto{pointer-events:auto;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
 background:rgba(0,0,0,.55);color:#fde68a;font-weight:700;font-size:12px;cursor:pointer;touch-action:manipulation;display:none}
#btnAuto.on{background:#16a34a;color:#fff}
#skillExplain{pointer-events:none;margin-top:2px;max-width:min(92vw,340px);padding:8px 12px;border-radius:12px;
 background:rgba(0,0,0,.72);border:1px solid rgba(251,191,36,.45);color:#fde68a;font-size:12px;line-height:1.35;
 display:none;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#skillExplain.show{display:block}
#skillExplain .sk-title{color:#fbbf24;font-weight:800;font-size:11px;letter-spacing:.3px;margin-bottom:2px}
.popup-wrap{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(0,0,0,.35)}
.popup-wrap.show{display:grid}
.popup-wrap.mini{inset:auto;top:8px;right:8px;left:auto;bottom:auto;place-items:start;background:transparent;padding:0;z-index:35}
.popup-wrap.mini .popup-panel{gap:6px;padding:8px;background:rgba(0,0,0,.72);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:42vw}
.popup-wrap.mini .popup-btn{min-width:0;width:100%;padding:10px 12px;font-size:13px;border-radius:10px}
.popup-wrap.mini #btnMinimize{display:none}
.popup-panel{display:flex;flex-direction:column;gap:12px;align-items:stretch;padding:16px;max-width:92vw}
.popup-btn{
  min-width:min(78vw,320px);padding:20px 24px;border:0;border-radius:18px;font-size:20px;font-weight:900;
  cursor:pointer;touch-action:manipulation;color:#1c1005;
  background-color:#fbbf24;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.12));
  border-bottom:4px solid rgba(0,0,0,.35);
  box-shadow:0 10px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4);
}
.popup-btn.exit{background-color:#16a34a;color:#fff}
.popup-btn.move{background-color:#fbbf24;color:#111}
.popup-btn.kick,.popup-btn.kick_rear,.popup-btn.fly_kick{background-color:#dc2626;color:#fff}
.popup-btn.fly{background-color:#7c3aed;color:#fff}
.popup-btn.home{background-color:#2563eb;color:#fff}
.popup-btn.mini-btn{background-color:#444;color:#fde68a;font-size:15px;padding:12px}
.popup-btn:active{transform:translateY(3px) scale(.98);border-bottom-width:1px;box-shadow:0 4px 12px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2)}
#slideLayer{position:fixed;inset:0;display:none;z-index:40;background:#000}
#slideLayer.show{display:block}
#slideFrame{position:absolute;inset:0;border:0;width:100%;height:100%}
#miniDice{position:fixed;top:8px;right:8px;z-index:35;display:none;width:min(31.5vw,150px);aspect-ratio:1/1.1;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.72);box-shadow:0 8px 24px rgba(0,0,0,.45);border:2px solid var(--seat-color,#fbbf24);pointer-events:none}
#miniDice.show{display:block}
#miniDice iframe{width:100%;height:100%;border:0;pointer-events:none}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#12080a;z-index:100;color:#fde68a;padding:16px;box-sizing:border-box}
#setup h1{margin:0 0 16px;font-size:22px;color:#f6d36a}
.setupLabel{font-size:12px;letter-spacing:1px;opacity:.75;margin:14px 0 8px;text-align:center}
#setup .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#setup button{
  padding:16px 22px;border-radius:16px;border:0;border-bottom:4px solid rgba(0,0,0,.4);
  background-color:#1a1010;background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.2));
  color:#fde68a;font-weight:700;font-size:16px;min-width:100px;min-height:48px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 8px 20px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
  border:1px solid #d4af37;border-bottom:4px solid rgba(0,0,0,.45);
}
#setup button:active{transform:translateY(2px);border-bottom-width:1px}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.88);z-index:60;color:#fde68a;font-size:26px;font-weight:900;flex-direction:column;gap:16px}
#win.show{display:grid}
#win button{padding:14px 22px;border-radius:14px;border:1px solid #d4af37;background:#1a1010;color:#fde68a;font-weight:700;font-size:15px;cursor:pointer}

.mode-active{outline:2px solid #d4af37;background:#2a1a0a!important}
.color-pick{min-width:72px!important;font-size:13px!important;padding:12px 14px!important}
.color-pick.mode-active{outline:3px solid #fde68a;transform:scale(1.05)}
#btnVol{margin-top:10px;font-size:13px!important;padding:10px 16px!important;min-width:auto!important}
#volPanel{
  display:none;position:fixed;left:10px;top:52px;width:min(92vw,380px);max-height:min(70vh,520px);
  overflow:auto;background:rgba(20,12,10,.97);border:1px solid #d4af37;border-radius:14px;
  padding:12px 14px;z-index:120;box-shadow:0 12px 40px rgba(0,0,0,.55);pointer-events:auto
}
#volPanel.show{display:block}
#volPanel .vol-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
#volPanel .vol-row label{min-width:88px;color:#fde68a}
#volPanel .vol-row input[type=range]{flex:1}
#volPanel .vol-row span{min-width:32px;text-align:right;opacity:.85}
#volPanel .vol-sec{margin:12px 0 6px;font-size:11px;letter-spacing:1px;color:#fbbf24;font-weight:800}
#volPanel .bgm-row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
#volPanel .bgm-row input[type=text]{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:1px solid #d4af37;background:#1a1010;color:#fde68a;font-size:13px}
#volPanel .bgm-row button,#volPanel .bgm-actions button{padding:8px 12px;border-radius:8px;border:1px solid #d4af37;background:#2a1a0a;color:#fde68a;font-weight:700;font-size:12px;cursor:pointer}
#volPanel .bgm-list{list-style:none;margin:0;padding:0;max-height:160px;overflow:auto}
#volPanel .bgm-list li{padding:8px 10px;border-radius:8px;margin:4px 0;background:rgba(255,255,255,.06);cursor:pointer;font-size:12px;color:#fde68a}
#volPanel .bgm-list li:active,#volPanel .bgm-list li.on{background:#7c2d12}
#volPanel .bgm-now{font-size:11px;opacity:.85;margin:6px 0;color:#fde68a;min-height:16px}
#volPanel .bgm-presets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#volPanel .bgm-presets button{padding:6px 10px;font-size:11px}
#btnFs{position:fixed;top:8px;right:8px;z-index:40;display:none;padding:8px 12px;border-radius:10px;border:1px solid #d4af37;background:rgba(0,0,0,.65);color:#fde68a;font-weight:700;font-size:12px;pointer-events:auto}
#btnFs.show{display:block}
/* volPanel luôn fixed; không phụ thuộc .inGame */
.skill-sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.skill-sheet-panel{width:100%;max-width:480px;max-height:78vh;overflow:auto;background:#1a1210;border-radius:18px 18px 0 0;padding:16px 14px 22px;border:1px solid #d4af37;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.skill-sheet-title{font-weight:800;color:#fde68a;text-align:center;margin-bottom:12px;font-size:16px}
.skill-systems{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.skill-systems button{padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#222;color:#eee;font-size:12px;font-weight:700}
.skill-systems button.active{border-color:#d4af37;color:#fde68a}
.skill-cards{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory}
.skill-card{flex:0 0 140px;scroll-snap-align:start;background:#241816;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;color:#eee;cursor:pointer}
.skill-card.selected{border-color:#d4af37;box-shadow:0 0 0 2px rgba(212,175,55,.35)}
.skill-card .sk-name{font-weight:800;font-size:13px;margin:4px 0}
.skill-card .sk-short{font-size:11px;opacity:.85;line-height:1.3}
.skill-detail{min-height:48px;font-size:12px;color:#fde68a;margin:8px 0 12px;line-height:1.4}
#btnConfirmSkill{width:100%}
#modeBadge{font-size:11px;opacity:.9;margin-left:6px}

#errBox{position:fixed;left:8px;right:8px;bottom:8px;z-index:200;display:none;padding:10px;border-radius:8px;background:rgba(80,0,0,.9);color:#fecaca;font-size:12px}
</style>
</head>
<body>
<div id="setup">
  <h1>Cá Ngựa 3D</h1>
  <div class="setupLabel">CHỌN MÀU QUÂN CỦA BẠN</div>
  <div class="row" id="colorPickRow">
    <button type="button" id="pickRed" class="color-pick mode-active" data-color="2" style="background:#c00000;color:#fff">Đỏ</button>
    <button type="button" id="pickCyan" class="color-pick" data-color="1" style="background:#0bd9ce;color:#111">Xanh ngọc</button>
    <button type="button" id="pickBlue" class="color-pick" data-color="3" style="background:#2012e0;color:#fff">Xanh</button>
    <button type="button" id="pickYellow" class="color-pick" data-color="0" style="background:#fff000;color:#111">Vàng</button>
  </div>
  <div class="setupLabel">CHẾ ĐỘ LUẬT</div>
  <div class="row" id="ruleModeRow">
    <button type="button" id="btnClassic" class="mode-active">Truyền thống</button>
    <button type="button" id="btnAdvanced">Nâng cao</button>
  </div>
  <div class="setupLabel">CHƠI CHUNG 1 MÁY</div>
  <div class="row">
    <button type="button" id="btn2">2</button>
    <button type="button" id="btn3">3</button>
    <button type="button" id="btn4">4</button>
  </div>
  <div class="setupLabel">CHƠI VỚI MÁY</div>
  <div class="row">
    <button type="button" id="btnBot1">1 MÁY</button>
    <button type="button" id="btnBot2">2 MÁY</button>
    <button type="button" id="btnBot3">3 MÁY</button>
  </div>
  <div class="setupLabel">ÂM THANH</div>
  <div class="row">
    <button type="button" id="btnVol">Tùy chỉnh âm lượng</button>
  </div>
</div>
<!-- volPanel ngoài setup — tránh bị display:none khi vào game -->
<div id="volPanel"></div>
<button type="button" id="btnFs">TOÀN MÀN HÌNH</button>
<div id="skillSheet" class="skill-sheet" style="display:none">
  <div class="skill-sheet-panel">
    <div class="skill-sheet-title">CHỌN KỸ NĂNG CHO NGỰA</div>
    <div id="skillSystems" class="skill-systems"></div>
    <div id="skillCards" class="skill-cards"></div>
    <div id="skillDetail" class="skill-detail"></div>
    <button type="button" id="btnConfirmSkill" class="popup-btn" disabled>XÁC NHẬN</button>
  </div>
</div>
<iframe id="boardFrame" src="about:blank" allow="autoplay"></iframe>
<div id="hud">
  <div id="hudRow">
    <button type="button" id="btnGear" class="badge" title="Cài đặt âm">⚙</button>
    <span id="badgeColor" class="badge">—</span>
    <span id="badgeDice" class="badge">·</span>
    <span id="badgeMode" class="badge">Pro</span>
    <button type="button" id="btnAuto" class="badge">Off</button>
  </div>
  <div id="skillExplain"><div class="sk-title">KỸ NĂNG</div><div id="skillExplainText"></div></div>
</div>
<div id="popupRoll" class="popup-wrap">
  <div class="popup-panel"><button type="button" class="popup-btn" id="btnRoll">LẮC</button></div>
</div>
<div id="popupAction" class="popup-wrap">
  <div class="popup-panel" id="actionPanel"></div>
</div>
<div id="slideLayer"><iframe id="slideFrame" src="about:blank" allow="autoplay"></iframe></div>
<div id="miniDice"><iframe id="miniDiceFrame" src="about:blank" allow="autoplay"></iframe></div>
<div id="win"><div id="winText"></div><button type="button" id="btnDownloadLog">TẢI LOG</button></div>
<div id="errBox"></div>
<script src="board-data.js"></script>
<script src="rules.js"></script>
<script src="actions.js"></script>
<script src="gamelog.js"></script>
<script src="advanced-skills.js"></script>
<script src="skill-events.js"></script>
<script src="advanced-rules.js"></script>
<script src="advanced-bot.js"></script>
<script src="advanced-fx.js"></script>
<script src="engine.js"></script>
<script src="bot.js"></script>
<script>
(function () {
  function showErr(msg) {
    var el = document.getElementById("errBox");
    el.style.display = "block";
    el.textContent = String(msg);
  }
  window.onerror = function (m, s, l) { showErr(m + " @" + l); };
  if (!window.BoardData || !window.Rules || !window.Engine || !window.Bot || !window.Actions) {
    showErr("load fail"); return;
  }

  var params = new URLSearchParams(location.search);
  var BOT_DELAY = {
    beforeRoll: params.get("botdelay") === "0" ? 0 : 700,
    beforeMove: params.get("botdelay") === "0" ? 0 : 500
  };
  var MINI_DICE_TIMING = { shake: 833, hold: 3250, openGap: 120 }; // ×2 nhanh hơn bản gốc
  var MINI_DICE_VOLUME = 0.35; // êm hơn khi bot lắc
  var DEBUG = params.get("debug") === "1";

  var boardFrame = document.getElementById("boardFrame");
  var popupRoll = document.getElementById("popupRoll");
  var popupAction = document.getElementById("popupAction");
  var actionPanel = document.getElementById("actionPanel");
  var btnRoll = document.getElementById("btnRoll");
  var btnAuto = document.getElementById("btnAuto");
  var slideLayer = document.getElementById("slideLayer");
  var slideFrame = document.getElementById("slideFrame");
  var miniDice = document.getElementById("miniDice");
  var miniDiceFrame = document.getElementById("miniDiceFrame");
  var badgeColor = document.getElementById("badgeColor");
  var badgeDice = document.getElementById("badgeDice");
  var badgeMode = document.getElementById("badgeMode");
    var hud = document.getElementById("hud");
  var setup = document.getElementById("setup");
  var winEl = document.getElementById("win");

  // —— Hệ âm thanh + volume 0–100 (gốc 100) ——
  var VOL_KEYS = [
    { id: "color", label: "Màu quân" },
    { id: "lac", label: "Lắc (giọng)" },
    { id: "shake", label: "Lắc (cơ)" },
    { id: "open", label: "Mở mặt" },
    { id: "dice", label: "Đọc mặt" },
    { id: "step", label: "Đếm bước" },
    { id: "xuat", label: "Xuất quân" },
    { id: "len", label: "Lên chuồng" },
    { id: "land", label: "Đáp đất" },
    { id: "fly", label: "Bay về" },
    { id: "kick", label: "Đá" },
    { id: "select", label: "Chọn quân" }
  ];
  // Hồ sơ âm "ru ngủ": SFX thấp, đều, tránh tiếng phô/giật
  var VOL_SLEEP = {
    master: 80,
    color: 32, lac: 28, shake: 18, open: 22, dice: 30,
    step: 26, xuat: 30, len: 30, land: 16, fly: 18, kick: 12, select: 18, bgm: 24
  };
  var volState = {};
  VOL_KEYS.forEach(function(k){ volState[k.id] = VOL_SLEEP[k.id] != null ? VOL_SLEEP[k.id] : 30; });
  volState.bgm = VOL_SLEEP.bgm;
  volState.master = VOL_SLEEP.master;
  try {
    var ver = localStorage.getItem("canguav3d.volVer");
    var raw = localStorage.getItem("canguav3d.vol");
    // ver 3 = hồ sơ ru ngủ; ép cập nhật 1 lần nếu người chơi chưa có ver mới
    if (raw && ver === "3") {
      var o = JSON.parse(raw);
      VOL_KEYS.forEach(function(k){
        if (typeof o[k.id] === "number") volState[k.id] = Math.max(0, Math.min(100, o[k.id]));
      });
      if (typeof o.bgm === "number") volState.bgm = Math.max(0, Math.min(100, o.bgm));
      if (typeof o.master === "number") volState.master = Math.max(0, Math.min(100, o.master));
    } else {
      // Thử cookie backup
      try {
        var m = document.cookie.match(/(?:^|; )canguav3d_vol=([^;]*)/);
        if (m) {
          var oc = JSON.parse(decodeURIComponent(m[1]));
          VOL_KEYS.forEach(function(k){
            if (typeof oc[k.id] === "number") volState[k.id] = Math.max(0, Math.min(100, oc[k.id]));
          });
          if (typeof oc.bgm === "number") volState.bgm = Math.max(0, Math.min(100, oc.bgm));
          if (typeof oc.master === "number") volState.master = Math.max(0, Math.min(100, oc.master));
        }
      } catch (e3) {}
      try { localStorage.setItem("canguav3d.volVer", "3"); } catch (e2) {}
      try { localStorage.setItem("canguav3d.vol", JSON.stringify(volState)); } catch (e2) {}
    }
  } catch (e) {}
  function volOf(id) {
    var v = (volState[id] != null ? volState[id] : 30) / 100;
    var m = (volState.master != null ? volState.master : 80) / 100;
    return Math.max(0, Math.min(1, v * m));
  }
  function saveVol() {
    try {
      localStorage.setItem("canguav3d.vol", JSON.stringify(volState));
      localStorage.setItem("canguav3d.volVer", "3");
      // Cookie backup (365 ngày) — khôi phục khi localStorage bị xóa nhẹ
      var exp = new Date(Date.now() + 365 * 864e5).toUTCString();
      document.cookie = "canguav3d_vol=" + encodeURIComponent(JSON.stringify(volState)) + "; expires=" + exp + "; path=/; SameSite=Lax";
      if (bgmState && bgmState.url) {
        document.cookie = "canguav3d_bgm=" + encodeURIComponent(JSON.stringify({ url: bgmState.url, title: bgmState.title || "" })) + "; expires=" + exp + "; path=/; SameSite=Lax";
      }
    } catch (e) {}
    pushVolToBoard();
    applyBgmVolume();
  }
  function pushVolToBoard() {
    try {
      var w = boardFrame && boardFrame.contentWindow;
      if (!w) return;
      w.__sfxVol = {
        step: volOf("step"), land: volOf("land"), fly: volOf("fly"),
        kick: volOf("kick"), select: volOf("select")
      };
    } catch (e) {}
  }

  var sfxShake = new Audio("a3a.mp3"); sfxShake.preload = "auto";
  var sfxOpen = new Audio("a3b.mp3"); sfxOpen.preload = "auto";
  var sfxDiceVoice = new Audio("dice.mp3"); sfxDiceVoice.preload = "auto";
  var sfxColor = new Audio("color.mp3"); sfxColor.preload = "auto";
  var sfxCmd = new Audio("cmd.mp3"); sfxCmd.preload = "auto";
  // color.mp3: Xanh(3), đỏ(2), vàng(0), xanh ngọc(1)
  var COLOR_SEG = {
    3: [0.00, 0.42],
    2: [0.86, 1.20],
    0: [1.66, 2.04],
    1: [2.50, 2.98]
  };
  // cmd.mp3: Lắc, lên, xuất quân
  var CMD_SEG = {
    lac: [0.00, 0.22],
    len: [0.70, 1.06],
    xuat: [1.54, 2.10]
  };
  var DICE_SEG = [
    [0.00, 0.28], [0.70, 0.95], [1.40, 1.70],
    [2.12, 2.45], [2.88, 3.20], [3.66, 3.95]
  ];
  var _segTimers = {};
  function playSfx(a, vol) {
    try {
      a.pause(); a.currentTime = 0;
      a.volume = (vol != null) ? vol : 1;
      var p = a.play(); if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }
  function playSegment(audio, start, end, vol, key) {
    try {
      if (_segTimers[key]) { clearTimeout(_segTimers[key]); _segTimers[key] = null; }
      audio.pause();
      audio.volume = (vol != null) ? vol : 1;
      audio.currentTime = start;
      var p = audio.play();
      if (p && p.catch) p.catch(function(){});
      var wall0 = performance.now();
      var dur = Math.max(0.05, end - start);
      function tick() {
        try {
          if (audio.paused || audio.ended) return;
          var elapsed = (performance.now() - wall0) / 1000;
          if (audio.currentTime >= end - 0.02 || elapsed >= dur) {
            audio.pause();
            return;
          }
          _segTimers[key] = setTimeout(tick, 25);
        } catch (e) {}
      }
      _segTimers[key] = setTimeout(tick, 30);
    } catch (e) {}
  }
  function playDiceFace(face) {
    face = face | 0;
    if (face < 1 || face > 6) return;
    var seg = DICE_SEG[face - 1];

  }

    playSegment(sfxCmd, seg[0], seg[1], volOf(vid), "cmd");
  }

  function explainSkillEvent(move, res) {
    if (!engine || engine.ruleMode !== "advanced" || !move) return null;
    // Không bao giờ giải thích khi chỉ xuất chuồng thường (skill còn bí mật)

    var feat = (res && res.pendingFeatFX) || {};
    var list = SkillEvents.explainAfterMove(engine.state, move, feat);
    if (!list || !list.length) return null;
    // Ưu tiên sự kiện mạnh nhất (L > M > S)
    var rank = { L: 3, M: 2, S: 1 };
    list.sort(function(a, b){ return (rank[b.tier]||0) - (rank[a.tier]||0); });
    var top = list[0];
    return { t: top.title, m: top.line, color: top.color };
  }

  function humanPickMove(moves) {
    return new Promise(function(resolve) {
      humanPickResolve = resolve;
      phase = "pick-action";
      setGameModeForPhase();
      var groups = groupTypes(moves);
      var keys = Object.keys(groups);
      if (keys.length === 1 && uniqueHorseIds(groups[keys[0]]).length === 1) {
        var m = groups[keys[0]][0];
        humanPickResolve = null;
        resolve({ move: m, auto: true });
        return;
      }
      if (keys.length === 1) {
        onPickType(keys[0], groups[keys[0]]);
        return;
      }
      actionMinimized = false;
      actionPanel.innerHTML = "";
      keys.forEach(function(t) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "popup-btn " + t;
        btn.textContent = TYPE_LABEL[t] || t;
        function go(e) { e.preventDefault(); onPickType(t, groups[t]); }
        btn.addEventListener("click", go);
        btn.addEventListener("touchend", go, { passive: false });
        actionPanel.appendChild(btn);
      });
      var mini = document.createElement("button");
      mini.type = "button";
      mini.id = "btnMinimize";
      mini.className = "popup-btn mini-btn";
      mini.textContent = "THU NHỎ";

  async function animateMove(move) {
    var api = boardAPI();
    behindCamForMove(move);
    var isKick = (move.type === "kick" || move.type === "kick_rear" || move.type === "fly_kick");
    var isFly = (move.type === "fly" || move.type === "fly_kick");
    // exit chỉ 1 ô
    var cells = move.cells || [];
    if (move.type === "exit" && cells.length > 1) cells = cells.slice(0, 1);
    if (api && cells.length) {
      if (move.type === "exit") {
        playCmd("xuat");
        await wait(playSegDuration(CMD_SEG.xuat[0], CMD_SEG.xuat[1]));
        // Không đọc "một" khi xuất quân
        await api.playSteps(move.horseId, cells, { noStepCount: true });
      } else if (move.type === "home") {
        playCmd("len");
        await wait(playSegDuration(CMD_SEG.len[0], CMD_SEG.len[1]));
        // Đọc đúng bậc đích (vd. lên 5 → "năm"), không đọc số bước = 1
        var hi = move.homeIndex || 1;
        if (api.playStepNumber) api.playStepNumber(hi);
        await wait(450);
        await api.playSteps(move.horseId, cells, { noStepCount: true });
      } else if (isFly && api.playFly) {
        await api.playFly(move.horseId, cells);
      } else {
        await api.playSteps(move.horseId, cells, isKick ? { kickLast: true } : {});
      }
    }
  }

  async function afterMoveAnimations(move, res) {
    var api = boardAPI();
    if (res.kick != null && api) {
      var v = engine.state.horses.find(function(h){ return h.id === res.kick; });
      if (v) {
        var dir = null;
        if (move.cells && move.cells.length >= 2) {
          var a = move.cells[move.cells.length - 2];
          var b = move.cells[move.cells.length - 1];
          dir = { x: b.gx - a.gx, z: -(b.gy - a.gy) };
        }
        await api.playKickReturn(v.id, v.gx, v.gy, {
          dirWorld: dir,
          reverse: move.type === "kick_rear"
        });

    syncBoard();

  async function runTurnLoop() {
    if (loopRunning) return;
    loopRunning = true;
    while (engine && engine.state.winner == null) {
      try {
        var seat = engine.currentSeat();
        engine.beginTurn();
        refreshHud();
        phase = "idle";
        setGameModeForPhase();

        if (isLocalHuman(seat)) {
          showRoll(true);
          await humanRoll();
          showRoll(false);
        } else {
          showRoll(false);
          showAction(false);
          await wait(BOT_DELAY.beforeRoll);
        }

        var r = engine.roll();
        refreshHud();
        await presentDice(r.dice, seat);

        if (r.noMove) {
          await wait(400);
          engine.resolveNoMove();
          continue;
        }

        var move, by, meta = {};
        var ActiveBot = (engine.ruleMode === "advanced" && window.AdvancedBot) ? AdvancedBot : Bot;
        if (isLocalHuman(seat)) {
          var picked = await humanPickMove(r.moves);
          move = picked.move;
          by = "human";
          meta.auto = !!picked.auto;
        } else {
          await wait(BOT_DELAY.beforeMove);
          move = ActiveBot.chooseMove(engine.state, r.moves);
          by = "bot";
          meta.rule = ActiveBot.classify(move, engine.state);
          meta.auto = r.moves.length === 1;
        }

        // Advanced: chọn skill khi xuất quân
        if (engine.ruleMode === "advanced" && move && move.type === "exit") {
          var h = engine.state.horses.find(function(x){ return x.id === move.horseId; });
          if (h && !h.skillId) {
            if (isLocalHuman(seat)) {
              var sid = await openSkillSelect(move.horseId);
              engine.assignSkill(move.horseId, sid);
            } else {
              engine.autoAssignSkillIfNeeded(move);
            }
          }
        }

        // Một lần chỉ 1 nước — exit dừng sau START, lượt thưởng chờ lắc lại
        engine.choose(move, by, meta);
        phase = "anim";
        busy = true;
        setGameModeForPhase();
        refreshHud();

        var watch = null;
        var animDone = false;
        try {
          watch = setTimeout(function() {
            if (!animDone) {
              try {
                engine.log.push("ERROR", engine.currentSeat(),
                  engine.seatInfo(engine.currentSeat()).colorId,
                  engine.seatInfo(engine.currentSeat()).controller,
                  { where: "watchdog" });
              } catch (e) {}
            }
          }, 30000);
          await animateMove(move);
        } catch (e) { showErr(e); }

        var res = engine.apply(move);
        try {
          if (window.AdvancedFX && engine.ruleMode === "advanced") {
            var boardApi = boardAPI() || window.__boardAPI || {};
            // Bridge combat text → skill explain panel
            boardApi.showCombatText = boardApi.showCombatText || function(hid, msg, col) {
              showSkillExplain("HIỆU ỨNG", msg);
            };
            AdvancedFX.play(move, res, boardApi);
          }
          var exp = explainSkillEvent(move, res);
          if (exp) showSkillExplain(exp.t, exp.m);
          await afterMoveAnimations(move, res);
        } catch (e) { showErr(e); syncBoard(); }

        animDone = true;
        if (watch) clearTimeout(watch);
        busy = false;
        phase = "idle";
        setGameModeForPhase();
        refreshHud();

        if (res.winner != null) {
          document.getElementById("winText").textContent = BoardData.COLORS[res.winner].name;
          winEl.classList.add("show");
          break;
        }
        engine.endTurnTracked();
      } catch (e) {
        showErr(e);
        busy = false;
        phase = "idle";
        setGameModeForPhase();
        try {
          if (engine && engine.state.winner == null) engine.endTurnTracked();
        } catch (e2) {}
        await wait(500);
      }
    }
    loopRunning = false;
  }

        var p = req.call(el);

  function startGame(opts) {
    if (engine) return;
    opts = opts || {};
    requestGameFullscreen();
    pushVolToBoard();
    // Nhạc nền êm — phát sau gesture vào game (fullscreen/start)
    try {
      if (bgmState.url && !bgmState.playing) {
        applyBgmVolume();
        bgmAudio.src = bgmState.url;
        bgmAudio.load();
        var bp = bgmAudio.play();
        if (bp && bp.then) bp.then(function(){ bgmState.playing = true; setBgmNowText(); }).catch(function(){});
        else bgmState.playing = true;
      }
    } catch (eB) {}
    var n = opts.numPlayers || 2;
    var ruleMode = opts.ruleMode || selectedRuleMode || "classic";
    modeHasBot = !opts.allHuman;
    autoPlay = false;
    // Thứ tự lượt: Đỏ(2), Xanh ngọc(1), Xanh(3), Vàng(0)
    var turnOrder = [2, 1, 3, 0].slice(0, n);
    var humanColor = opts.humanColor != null ? opts.humanColor : selectedColorId;
    var humanSeat = turnOrder.indexOf(humanColor);
    if (humanSeat < 0) humanSeat = 0;
    var seats = [];
    for (var i = 0; i < n; i++) {
      if (opts.allHuman) seats.push({ controller: "human-local" });
      else seats.push({ controller: (i === humanSeat) ? "human-local" : "bot" });
    }
    engine = Engine.create({ numPlayers: n, seats: seats, humanSeat: humanSeat, ruleMode: ruleMode });
    engine.beginGame();
    // mode hiển thị qua badgeMode trong refreshHud

    if (DEBUG) window.__gameLog = engine.log;

    setup.style.display = "none";
    hud.style.display = "flex";
    var vp = document.getElementById("volPanel");
    if (vp) vp.classList.remove("show");
    boardFrame.style.display = "block";
    boardFrame.src = "board.html";
    phase = "idle";
    refreshHud();

    var tries = 0;
    (function trySync() {
      tries++;
      if (boardAPI()) { syncBoard(); runTurnLoop(); return; }
      if (tries < 50) setTimeout(trySync, 200);
      else runTurnLoop();
    })();
  }

  bindTap(document.getElementById("btn2"), function(){ startGame({ numPlayers: 2, allHuman: true }); });
  bindTap(document.getElementById("btn3"), function(){ startGame({ numPlayers: 3, allHuman: true }); });
  bindTap(document.getElementById("btn4"), function(){ startGame({ numPlayers: 4, allHuman: true }); });
  bindTap(document.getElementById("btnBot1"), function(){ startGame({ numPlayers: 2, humanSeat: 0 }); });
  bindTap(document.getElementById("btnBot2"), function(){ startGame({ numPlayers: 3, humanSeat: 0 }); });
  bindTap(document.getElementById("btnBot3"), function(){ startGame({ numPlayers: 4, humanSeat: 0 }); });
  bindTap(document.getElementById("btnDownloadLog"), function() {
    if (engine && engine.log) engine.log.download();
  });
  // —— Volume panel + nhạc nền (stream Internet Archive) ——
  var bgmAudio = new Audio();
  bgmAudio.loop = true;
  bgmAudio.preload = "none";
  var bgmState = { url: "", title: "", playing: false };
  try {
    var br = localStorage.getItem("canguav3d.bgm");
    if (br) { var bo = JSON.parse(br); if (bo.url) { bgmState.url = bo.url; bgmState.title = bo.title || ""; } }
  } catch (e) {}
  if (volState.bgm == null) volState.bgm = 24;

  // Preset: ưu tiên piano êm / ambient chậm — phù hợp "ru ngủ"
  var BGM_PRESETS = [
    { title: "Piano êm", url: "https://archive.org/download/instrumental-sounds/calming-piano-tune-for-serene-moments-232562.mp3" },
    { title: "Lofi Chill", url: "https://archive.org/download/instrumental-sounds/chill-lofi-instrumental-for-study-sessions-231879.mp3" },
    { title: "Guitar chậm", url: "https://archive.org/download/instrumental-sounds/calm-simple-guitar-piano-emotions-long-232749.mp3" },
    { title: "Peaceful", url: "https://archive.org/download/peaceful-tracks/001.mp3" },
    { title: "Biển trong", url: "https://archive.org/download/instrumental-sounds/clarity-of-the-sea-calm-piano-232597.mp3" }
  ];
  var BGM_DEFAULT = BGM_PRESETS[0];
  if (!bgmState.url) {
    bgmState.url = BGM_DEFAULT.url;
    bgmState.title = BGM_DEFAULT.title;
    try { localStorage.setItem("canguav3d.bgm", JSON.stringify({ url: bgmState.url, title: bgmState.title })); } catch (e2) {}
  }

  function applyBgmVolume() {
    try {
      var b = (volState.bgm != null ? volState.bgm : 24) / 100;
      var m = (volState.master != null ? volState.master : 80) / 100;
      bgmAudio.volume = Math.max(0, Math.min(1, b * m));
    } catch (e) {}
  }
  function saveBgm() {
    try { localStorage.setItem("canguav3d.bgm", JSON.stringify({ url: bgmState.url, title: bgmState.title })); } catch (e) {}
  }
  function setBgmNowText() {
    var el = document.getElementById("bgmNow");
    if (!el) return;
    if (!bgmState.url) el.textContent = "Chưa chọn bài";
    else el.textContent = (bgmState.playing ? "▶ " : "❚❚ ") + (bgmState.title || bgmState.url);
  }
  function playBgmUrl(url, title) {
    if (!url) return;
    bgmState.url = url;
    bgmState.title = title || url;
    saveBgm();
    applyBgmVolume();
    try {
      bgmAudio.pause();
      bgmAudio.src = url;
      bgmAudio.load();
      var p = bgmAudio.play();
      if (p && p.catch) p.catch(function(){ bgmState.playing = false; setBgmNowText(); });
      bgmState.playing = true;
    } catch (e) { bgmState.playing = false; }
    setBgmNowText();
  }
  function stopBgm() {
    try { bgmAudio.pause(); } catch (e) {}
    bgmState.playing = false;
    setBgmNowText();
  }
  function toggleBgm() {
    if (!bgmState.url) return;
    if (bgmState.playing) stopBgm();
    else playBgmUrl(bgmState.url, bgmState.title);
  }

  async function searchArchiveAudio(q) {
    var query = encodeURIComponent('mediatype:audio AND (' + q + ')');
    var url = "https://archive.org/advancedsearch.php?q=" + query + "&fl[]=identifier&fl[]=title&fl[]=creator&rows=12&page=1&output=json";
    var res = await fetch(url);
    if (!res.ok) throw new Error("Tìm kiếm thất bại");
    var data = await res.json();
    var docs = (data.response && data.response.docs) || [];
    return docs;
  }
  async function listArchiveMp3(identifier) {
    var res = await fetch("https://archive.org/metadata/" + encodeURIComponent(identifier));
    if (!res.ok) throw new Error("Không đọc được album");
    var data = await res.json();
    var files = (data.files || []).filter(function(f) {
      var n = (f.name || "").toLowerCase();
      var fmt = (f.format || "").toLowerCase();
      return n.endsWith(".mp3") || fmt.indexOf("mp3") >= 0;
    });
    return files.map(function(f) {
      return {
        name: f.name,
        title: f.name.replace(/\.mp3$/i, ""),
        url: "https://archive.org/download/" + identifier + "/" + encodeURIComponent(f.name).replace(/%2F/g, "/")
      };
    });
  }

  function buildVolPanel() {
    var panel = document.getElementById("volPanel");
    if (!panel) return;
    panel.innerHTML = "";

    var sec0 = document.createElement("div");
    sec0.className = "vol-sec";
    sec0.textContent = "ÂM LƯỢNG TỔNG (chỉ web game)";
    panel.appendChild(sec0);
    (function() {
      var row = document.createElement("div");
      row.className = "vol-row";
      var lab = document.createElement("label");
      lab.textContent = "Tổng";
      var inp = document.createElement("input");
      inp.type = "range"; inp.min = "0"; inp.max = "100";
      inp.value = String(volState.master != null ? volState.master : 80);
      var val = document.createElement("span");
      val.textContent = inp.value;
      inp.addEventListener("input", function() {
        volState.master = parseInt(inp.value, 10) || 0;
        val.textContent = String(volState.master);
        saveVol();
      });
      row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
      panel.appendChild(row);
    })();

    var sec1 = document.createElement("div");
    sec1.className = "vol-sec";
    sec1.textContent = "ÂM HIỆU ỨNG";
    panel.appendChild(sec1);

    VOL_KEYS.forEach(function(k) {
      var row = document.createElement("div");
      row.className = "vol-row";
      var lab = document.createElement("label");
      lab.textContent = k.label;
      var inp = document.createElement("input");
      inp.type = "range"; inp.min = "0"; inp.max = "100"; inp.value = String(volState[k.id]);
      var val = document.createElement("span");
      val.textContent = String(volState[k.id]);
      inp.addEventListener("input", function() {
        volState[k.id] = parseInt(inp.value, 10) || 0;
        val.textContent = String(volState[k.id]);
        saveVol();
      });
      row.appendChild(lab); row.appendChild(inp); row.appendChild(val);
      panel.appendChild(row);
    });

    // BGM volume
    var rowB = document.createElement("div");
    rowB.className = "vol-row";
    var labB = document.createElement("label"); labB.textContent = "Nhạc nền";
    var inpB = document.createElement("input");
    inpB.type = "range"; inpB.min = "0"; inpB.max = "100"; inpB.value = String(volState.bgm != null ? volState.bgm : 40);
    var valB = document.createElement("span"); valB.textContent = inpB.value;
    inpB.addEventListener("input", function() {
      volState.bgm = parseInt(inpB.value, 10) || 0;
      valB.textContent = String(volState.bgm);
      saveVol();
      applyBgmVolume();
    });
    rowB.appendChild(labB); rowB.appendChild(inpB); rowB.appendChild(valB);
    panel.appendChild(rowB);

    var sec2 = document.createElement("div");
    sec2.className = "vol-sec";
    sec2.textContent = "NHẠC NỀN (stream — không cần tải)";
    panel.appendChild(sec2);

    var presets = document.createElement("div");
    presets.className = "bgm-presets";
    BGM_PRESETS.forEach(function(pr) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = pr.title;
      b.addEventListener("click", function() { playBgmUrl(pr.url, pr.title); });
      presets.appendChild(b);
    });
    panel.appendChild(presets);

    var searchRow = document.createElement("div");
    searchRow.className = "bgm-row";
    var inpQ = document.createElement("input");
    inpQ.type = "text";
    inpQ.id = "bgmQuery";
    inpQ.placeholder = "Tìm trên Internet Archive…";
    var btnS = document.createElement("button");
    btnS.type = "button";
    btnS.textContent = "Tìm";
    searchRow.appendChild(inpQ);
    searchRow.appendChild(btnS);
    panel.appendChild(searchRow);

    var list = document.createElement("ul");
    list.className = "bgm-list";
    list.id = "bgmList";
    panel.appendChild(list);

    var now = document.createElement("div");
    now.className = "bgm-now";
    now.id = "bgmNow";
    panel.appendChild(now);

    var acts = document.createElement("div");
    acts.className = "bgm-actions bgm-row";
    var btnPlay = document.createElement("button"); btnPlay.type = "button"; btnPlay.textContent = "Phát / Tạm dừng";
    var btnStop = document.createElement("button"); btnStop.type = "button"; btnStop.textContent = "Dừng";
    btnPlay.addEventListener("click", toggleBgm);
    btnStop.addEventListener("click", stopBgm);
    acts.appendChild(btnPlay); acts.appendChild(btnStop);
    panel.appendChild(acts);

    function renderResults(items, mode) {
      list.innerHTML = "";
      if (!items.length) {
        var empty = document.createElement("li");
        empty.textContent = "Không có kết quả";
        list.appendChild(empty);
        return;
      }
      items.forEach(function(it) {
        var li = document.createElement("li");
        if (mode === "album") {
          li.textContent = "📁 " + (it.title || it.identifier);
          li.addEventListener("click", function() {
            list.innerHTML = "<li>Đang tải danh sách bài…</li>";
            listArchiveMp3(it.identifier).then(function(files) {
              renderResults(files.map(function(f) {
                return { title: f.title, url: f.url, isTrack: true };
              }), "track");
            }).catch(function(err) {
              list.innerHTML = "<li>Lỗi: " + (err.message || err) + "</li>";
            });
          });
        } else {
          li.textContent = "♪ " + (it.title || "Bài hát");
          li.addEventListener("click", function() {
            playBgmUrl(it.url, it.title);
            Array.prototype.forEach.call(list.children, function(c){ c.classList.remove("on"); });
            li.classList.add("on");
          });
        }
        list.appendChild(li);
      });
    }

    async function doSearch() {
      var q = (inpQ.value || "").trim();
      if (!q) return;
      list.innerHTML = "<li>Đang tìm…</li>";
      try {
        var docs = await searchArchiveAudio(q);
        renderResults(docs.map(function(d) {
          return { identifier: d.identifier, title: d.title || d.identifier };
        }), "album");
      } catch (err) {
        list.innerHTML = "<li>Lỗi mạng / CORS: " + (err.message || err) + "</li>";
      }
    }
    btnS.addEventListener("click", doSearch);
    inpQ.addEventListener("keydown", function(e) {
      if (e.key === "Enter") { e.preventDefault(); doSearch(); }
    });

    setBgmNowText();
    applyBgmVolume();
  }
  buildVolPanel();

  function toggleVolPanel(e) {
    try { if (e) { e.preventDefault(); e.stopPropagation(); } } catch (err) {}
    var panel = document.getElementById("volPanel");
    if (!panel) return;
    var opening = !panel.classList.contains("show");
    if (opening) {
      // Trong game: góc trên-trái dưới HUD; ngoài setup: gần giữa màn
      var setup = document.getElementById("setup");
      var setupOn = setup && setup.style.display !== "none" && getComputedStyle(setup).display !== "none";
      if (setupOn) {
        panel.style.left = "50%";
        panel.style.top = "12%";
        panel.style.transform = "translateX(-50%)";
      } else {
        panel.style.left = "10px";
        panel.style.top = "52px";
        panel.style.transform = "none";
      }
      panel.classList.add("show");
    } else {
      panel.classList.remove("show");
    }
  }
  // Gắn nhiều kiểu sự kiện — tránh pointer-events / passive touch chặn
  (function wireGear() {
    var gear = document.getElementById("btnGear");
    var btnVol = document.getElementById("btnVol");
    function attach(el) {
      if (!el) return;
      el.style.pointerEvents = "auto";
      el.onclick = toggleVolPanel;
      el.addEventListener("touchend", function(ev) {
        ev.preventDefault();
        toggleVolPanel(ev);
      }, { passive: false });
    }
    attach(gear);
    attach(btnVol);
  })();
  bindTap(document.getElementById("btnFs"), function(){ requestGameFullscreen(); pushVolToBoard(); });


  bindTap(document.getElementById("btnClassic"), function(){ setRuleMode("classic"); });
  bindTap(document.getElementById("btnAdvanced"), function(){ setRuleMode("advanced"); });
  setRuleMode(selectedRuleMode);

  function setHumanColor(cid) {
    selectedColorId = cid | 0;
    ["pickRed","pickCyan","pickBlue","pickYellow"].forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle("mode-active", parseInt(el.getAttribute("data-color"),10) === selectedColorId);
    });
  }
  bindTap(document.getElementById("pickRed"), function(){ setHumanColor(2); });
  bindTap(document.getElementById("pickCyan"), function(){ setHumanColor(1); });
  bindTap(document.getElementById("pickBlue"), function(){ setHumanColor(3); });
  bindTap(document.getElementById("pickYellow"), function(){ setHumanColor(0); });
  setHumanColor(selectedColorId);

  // Service Worker — cache asset để lần sau vào nhanh hơn
  if ("serviceWorker" in navigator) {
    try {
      navigator.serviceWorker.register("sw.js").catch(function(){});
    } catch (e) {}
  }

  /* ===== Skill select Bottom Sheet (advanced) ===== */
  var skillSelectResolve = null;
  var selectedSkillId = null;

  function openSkillSelect(horseId) {
    return new Promise(function(resolve) {
      if (!window.AdvancedSkills) { resolve(1); return; }
      skillSelectResolve = resolve;
      selectedSkillId = null;
      var sheet = document.getElementById("skillSheet");
      var systemsEl = document.getElementById("skillSystems");
      var cardsEl = document.getElementById("skillCards");
      var detailEl = document.getElementById("skillDetail");
      var btn = document.getElementById("btnConfirmSkill");
      btn.disabled = true;
      detailEl.textContent = "";
      systemsEl.innerHTML = "";
      cardsEl.innerHTML = "";
      var systems = AdvancedSkills.SYSTEMS;
      var currentSys = "breakthrough";
      Object.keys(systems).forEach(function(key) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = systems[key].name;
        b.dataset.sys = key;
        if (key === currentSys) b.classList.add("active");
        b.addEventListener("click", function() {
          currentSys = key;
          Array.prototype.forEach.call(systemsEl.querySelectorAll("button"), function(x){ x.classList.toggle("active", x.dataset.sys === key); });
          renderCards();
        });
        systemsEl.appendChild(b);
      });
      function renderCards() {
        cardsEl.innerHTML = "";
        var list = AdvancedSkills.listBySystem(currentSys);
        list.forEach(function(sk) {
          var ok = AdvancedSkills.canSelectSkill(engine.state, engine.state.players[engine.state.current].colorId, sk.id);
          var card = document.createElement("div");
          card.className = "skill-card" + (ok ? "" : " disabled");
          card.style.opacity = ok ? "1" : "0.4";
          card.innerHTML = '<div style="font-size:11px;color:'+sk.color+'">'+sk.systemName+'</div>' +
            '<div class="sk-name">'+sk.name+'</div>' +
            '<div class="sk-short">'+sk.short+'</div>';
          if (ok) {
            card.addEventListener("click", function() {
              selectedSkillId = sk.id;
              Array.prototype.forEach.call(cardsEl.querySelectorAll(".skill-card"), function(x){ x.classList.remove("selected"); });
              card.classList.add("selected");
              detailEl.innerHTML = "<b>"+sk.name+"</b>: "+sk.desc+"<br><span style='opacity:.8'>Điểm yếu: "+sk.weakness+"</span>";
              btn.disabled = false;
            });
          }
          cardsEl.appendChild(card);
        });
      }
      renderCards();
      sheet.style.display = "flex";
      btn.onclick = function() {
        if (selectedSkillId == null) return;
        sheet.style.display = "none";
        var r = skillSelectResolve;
        skillSelectResolve = null;
        if (r) r(selectedSkillId);
      };
    });
  }

  // Hook: before applying exit in advanced mode for human, open skill sheet
  var _origChooseAndApply = null;
})();
